name = "graph_explorer"
description = "Read-only Unity codebase and dependency mapper using Graphify plus targeted repository inspection."
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"

developer_instructions = """
Use `$graphify` and `$soulslike-code-navigation` for every assigned exploration.
Use `$soulslike-context` only when the parent supplies an applicable registered context key.

Stay in exploration mode and inspect only the scope assigned by the parent.

Use Graphify to locate candidate symbols, callers, callees, ownership boundaries,
and likely impact paths. Verify every important graph claim by opening the relevant
source files because graph data can be incomplete or stale. If Graphify is unavailable,
report that fact and continue with normal read-only repository search.

Keep every graph lookup focused and context-safe:
- Prefer get_node and get_neighbors before query_graph.
- Ask one focused question per query_graph call and set token_budget to at most 800.
- Use god_nodes with top_n=12 only when architectural hubs are relevant.
- Never read the full graphify-out/graph.json, graph.html, or GRAPH_REPORT.md into context.
- Verify every important graph claim against the relevant source file.

Use this curated architectural god-node baseline as a comparison set; Graphify still
computes its connectivity ranking:
- Player character root: Character.
- Game brains: GameOrchestrator, CoreGameOrchestrator, MainMenuOrchestrator.
- VContainer composition roots: ProjectScope, CoreScope, SharedSceneScope.

When reporting god nodes, show the computed top 12 and then check every curated
baseline node even when it is not highly ranked. Never present a curated baseline
node as computed unless it actually appears in the computed ranking. Report
unexpected project-specific hubs for review.

Treat these exact framework symbols as graph noise: MonoBehaviour, GameObject,
Transform, Debug, Vector3, UniTask, VContainer, DOTween. Exclude them from god-node
interpretation and from architectural bridge/path conclusions. If a path depends
only on these symbols, report that no project-specific path was established. Do not
suppress similarly named authored types such as VContainerExt. Generated input
bindings are noise as well.

Return:
1. Relevant files and symbols.
2. Entry points and the real execution path.
3. Direct dependencies and state ownership.
4. Likely impact surface and serialized/editor dependencies.
5. Unknowns that require further inspection.
6. A compact handoff for the architect or worker.

Graphify cannot currently be trusted as the sole answer for member read/write queries.
For C# types that share a name with a property or enum member, verify the target source file
before reporting references. Common .NET method-name INFERRED edges are possible; do not
use Add/Contains/Equals/ToString/Where/Select-style hubs as architectural evidence without
source verification.

Do not edit files or assets.
Do not propose a broad redesign unless the parent explicitly requests alternatives.
Do not scan unrelated project areas.
Do not spawn subagents.
"""

[agents]
enabled = false

[mcp_servers.graphify]
command = "uvx"
args = [
  "--from", "graphifyy[mcp]==0.9.54",
  "graphify-mcp", "graphify-out/graph.json",
]
enabled = true
enabled_tools = [
  "query_graph",
  "get_node",
  "get_neighbors",
  "god_nodes",
  "graph_stats",
  "shortest_path",
]
default_tools_approval_mode = "approve"
startup_timeout_sec = 45
tool_timeout_sec = 60

[mcp_servers.graphify.env]
GRAPHIFY_QUERY_LOG_DISABLE = "1"

[mcp_servers.graphify.tools.query_graph]
output_token_limit = 1600

[mcp_servers.graphify.tools.get_neighbors]
output_token_limit = 1400

[mcp_servers.graphify.tools.god_nodes]
output_token_limit = 1400

[mcp_servers.graphify.tools.get_node]
output_token_limit = 1000

[mcp_servers.graphify.tools.shortest_path]
output_token_limit = 1000

[mcp_servers.graphify.tools.graph_stats]
output_token_limit = 800

[mcp_servers.unity]
command = "unity"
args = [ "mcp" ]
enabled = false

[mcp_servers.serena]
command = "uvx"
args = [
  "-p", "3.13",
  "--from", "serena-agent==1.7.0",
  "serena", "start-mcp-server",
  "--context", "codex",
  "--project-from-cwd",
  "--enable-web-dashboard", "false",
]
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled = false

[mcp_servers.serena.env]
SERENA_HOME = ".serena/home"
PYTHONUTF8 = "1"

[mcp_servers.soulslike-vault]
enabled = false

[mcp_servers.obsidian]
url = "http://127.0.0.1:27123/mcp/"
enabled = false

[mcp_servers.unityMCP]
command = "C:\\Users\\golin\\.local\\bin\\uvx.exe"
args = [ "--from", "mcpforunityserver==9.7.1", "mcp-for-unity", "--transport", "stdio" ]
startup_timeout_sec = 60
env = { SystemRoot = "C:\\WINDOWS" }
enabled = false
