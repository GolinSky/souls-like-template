[mcp_servers.unity]
command = "unity"
args = [ "mcp" ]

[mcp_servers.serena]
command = "uvx"
args = [
  "-p", "3.13",
  "--from", "serena-agent==1.7.0",
  "serena", "start-mcp-server",
  "--context", "codex",
  "--project-from-cwd",
  "--enable-web-dashboard", "false",
]
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.serena.env]
SERENA_HOME = ".serena/home"
PYTHONUTF8 = "1"

[mcp_servers.obsidian]
url = "http://127.0.0.1:27123/mcp/"
http_headers = { Authorization = "Bearer 247bf062f78ebaa671225b2f5c372e8aa5e19342ae1cc0304271a68257e4cc43" }

[mcp_servers.graphify]
command = "uvx"
args = [ "--from", "graphifyy", "python", "-m", "graphify.serve", "graphify-out/graph.json" ]
enabled = false
enabled_tools = [ "query_graph", "get_node", "get_neighbors", "god_nodes", "graph_stats", "shortest_path" ]
default_tools_approval_mode = "approve"
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.graphify.env]
GRAPHIFY_QUERY_LOG_DISABLE = "1"

# Compatibility tombstone: the user-level config still defines this legacy server.
# Keep it disabled here so the project exposes only the official `unity mcp` bridge.
[mcp_servers.unityMCP]
enabled = false

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"
interrupt_message = true
